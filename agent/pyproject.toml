[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stoe-research-agent"
version = "0.1.0"
description = "A supervised, persistent self-rebuild cycle for the SToE research collaborator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stoe-agent = "stoe_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
